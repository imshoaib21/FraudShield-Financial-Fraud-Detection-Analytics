<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e2140">
  <title>FraudShield | Financial Fraud Detection & Analytics</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#eaf0f7;color:#142946;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
    header{min-height:72px;background:#0e2140;color:white;padding:14px clamp(15px,3vw,38px);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
    h1{font-size:clamp(16px,2vw,21px);line-height:1.2;margin:0}
    p{font-size:12px;color:#becfe4;margin:5px 0 0}
    .actions{display:flex;gap:9px;flex-wrap:wrap}
    a.button{display:inline-flex;align-items:center;border-radius:9px;padding:9px 13px;text-decoration:none;background:#edf4ff;color:#132e51;font-weight:700;font-size:13px}
    a.button.secondary{background:#23476d;color:#fff}
    main{padding:12px;max-width:1920px;margin:auto}
    iframe{width:100%;height:calc(100dvh - 100px);min-height:470px;background:white;border:1px solid #c5d3e4;border-radius:12px;display:block}
    .note{font-size:12px;color:#47617d;text-align:center;margin:10px 0}
    .note a{color:#174d92}
    @media (max-width:600px){iframe{height:calc(100dvh - 151px)}main{padding:6px}}
  </style>
</head>
<body>
  <header>
    <div><h1>FraudShield | Financial Fraud Detection & Analytics</h1><p>4-page Power BI dashboard · PDF preview</p></div>
    <nav class="actions" aria-label="PDF actions">
      <a class="button secondary" href="./dashboard.pdf" target="_blank" rel="noopener">Open PDF</a>
      <a class="button" href="./dashboard.pdf" download="FraudShield_Dashboard.pdf">Download PDF</a>
    </nav>
  </header>
  <main>
    <iframe title="FraudShield four-page financial fraud dashboard" src="./dashboard.pdf#toolbar=1&navpanes=0" loading="eager">
      Your browser doesn't support the PDF viewer. <a href="./dashboard.pdf">Open the dashboard PDF</a>.
    </iframe>
    <div class="note">If the PDF viewer is blank, select <a href="./dashboard.pdf" target="_blank" rel="noopener">Open PDF</a>. This PDF preview is not an interactive Power BI report.</div>
  </main>
</body>
</html>
